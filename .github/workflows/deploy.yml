name: Deploy WineCircle

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install & Build
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Deploy to Oracle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "app/dist/*"
          target: "/tmp/winecircle-deploy"
          strip_components: 2

      - name: Activate deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            sudo rsync -a --delete /tmp/winecircle-deploy/ /var/www/winecircle/
            rm -rf /tmp/winecircle-deploy
            echo "✅ Deployed $(date)"
