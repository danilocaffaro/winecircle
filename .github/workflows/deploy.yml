name: Build & Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Type check
        working-directory: app
        run: npx tsc --noEmit

      - name: Build
        working-directory: app
        run: npm run build

      - name: Verify build output
        working-directory: app
        run: |
          test -f dist/index.html || (echo "❌ Build failed: no index.html" && exit 1)
          FILE_COUNT=$(find dist -type f | wc -l)
          echo "✅ Build OK: $FILE_COUNT files"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: app/dist
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Verify CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "✅ CI guard skipped (push — needs: enforces CI)"
            exit 0
          fi
          for i in 1 2 3 4 5 6; do
            STATUS=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs \
              --jq '[.check_runs[] | select(.name=="ci") | .conclusion] | first // "pending"')
            [ "$STATUS" = "success" ] && break
            echo "Attempt $i: status=$STATUS, waiting 15s..."
            sleep 15
          done
          if [ "$STATUS" != "success" ]; then
            echo "❌ CI not green ($STATUS). Aborting deploy."
            exit 1
          fi
          echo "✅ CI verified: $STATUS"

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via rsync
        run: |
          rsync -azP --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            dist/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/winecircle-staging/

      - name: Activate & health check
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "sudo /usr/local/bin/winecircle-deploy-activate.sh"

      - name: Verify deployment
        run: |
          sleep 3
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://winecircle.melhor.dev)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Deployment verified (HTTP $HTTP_CODE)"
          else
            echo "❌ Health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
