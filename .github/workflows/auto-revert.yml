name: Auto-revert on CI failure (main)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  auto-revert:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    # `workflows: write` não existe como escopo de permissions — e uma chave
    # inválida aqui não é ignorada: derruba o workflow no carregamento. Era por
    # isso que este arquivo aparecia como falha instantânea desde sempre, sem
    # job nenhum e identificado pelo caminho em vez do nome. O protocolo T40
    # nunca chegou a rodar uma vez.
    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Create revert PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BAD_SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT="${BAD_SHA:0:7}"
          BRANCH="auto-revert/${SHORT}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git revert --no-edit "$BAD_SHA" || {
            echo "⚠️ Revert conflict — manual intervention needed"
            exit 0
          }
          git push origin "$BRANCH"

          gh pr create \
            --title "🔴 Auto-revert: CI failed on ${SHORT}" \
            --body "CI failed on commit ${BAD_SHA}. This PR reverts it automatically (T40 protocol).

          Run: ${{ github.event.workflow_run.html_url }}

          **Review and merge ASAP**, or close if the failure was transient." \
            --base main \
            --head "$BRANCH"

          echo "✅ Revert PR created for $SHORT"
